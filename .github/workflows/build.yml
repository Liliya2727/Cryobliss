name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build module + app
    runs-on: ubuntu-latest

    env:
      # Never try to flash a device or post to Telegram from CI
      FLASHTODEVICE: "0"
      SENDTOTELEGRAM: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash build.sh

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuisei-module-${{ github.sha }}
          path: Build/*.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuisei-apk-${{ github.sha }}
          path: Modules/ProjectSuisei.apk
          if-no-files-found: error
